<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Suppliers</title>
</head>
<body>
<h1>List of Suppliers</h1>
<a href="/suppliers/add">Add New Supplier</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Address</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="supplier : ${suppliers}">
        <td th:text="${supplier.id}"></td>
        <td th:text="${supplier.name}"></td>
        <td th:text="${supplier.address}"></td>
        <td>
            <a th:href="@{/suppliers/edit/{id}(id=${supplier.id})}">Edit</a>
            <a th:href="@{/suppliers/delete/{id}(id=${supplier.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
