<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Owners</title>
</head>
<body>
<h1>List of Owners</h1>
<a href="/owners/add">Add New Owner</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="owner : ${owners}">
        <td th:text="${owner.id}"></td>
        <td th:text="${owner.firstName}"></td>
        <td th:text="${owner.lastName}"></td>
        <td th:text="${owner.phone}"></td>
        <td th:text="${owner.email}"></td>
        <td>
            <a th:href="@{/owners/edit/{id}(id=${owner.id})}">Edit</a>
            <a th:href="@{/owners/delete/{id}(id=${owner.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
