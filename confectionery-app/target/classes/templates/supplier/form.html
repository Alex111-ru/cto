<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Supplier Form</title>
</head>
<body>
<h1>Supplier Form</h1>
<form th:action="@{/suppliers/save}" th:object="${supplier}" method="post">
    <label>ID:</label>
    <input type="text" th:field="*{id}" disabled="disabled"/>
    <br/>
    <label>Name:</label>
    <input type="text" th:field="*{name}"/>
    <br/>
    <label>Address:</label>
    <input type="text" th:field="*{address}"/>
    <br/>
    <button type="submit">Save</button>
</form>
<a href="/suppliers">Back to list</a>
</body>
</html>
